<!doctype html>
<html lang="en" class="lock">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#7cc8ef">
    <!--OG-->
    <link rel="icon" type="image/png" href="/web/trippy-icon.png">
    <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="/web/styles.css">
  </head>
  <body>
    <div class="bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="app">
      <div class="bubble-only glass" id="bubble"></div>
      <div class="top">
        <header class="header glass">
          <img class="logo" id="logo" src="/web/trippy.png" alt="Trippy, your road-trip copilot" width="480" height="384">
          <div class="titles">
            <h1 id="title">Loading trip…</h1>
            <p class="sub" id="subtitle"></p>
          </div>
          <span class="badge" id="badge" hidden></span>
        </header>
        <div class="tabs glass" role="tablist" aria-label="Dashboard sections">
          <button class="tab" role="tab" id="tab-map" aria-controls="pane-map" data-tab="map" type="button">
            <span class="ico" aria-hidden="true">🗺️</span>Map
          </button>
          <button class="tab" role="tab" id="tab-schedule" aria-controls="pane-schedule" data-tab="schedule" type="button">
            <span class="ico" aria-hidden="true">📋</span>Schedule
          </button>
          <button class="tab" role="tab" id="tab-impact" aria-controls="pane-impact" data-tab="impact" type="button">
            <span class="ico" aria-hidden="true">🌱</span>Impact
          </button>
          <button class="tab" role="tab" id="tab-trip" aria-controls="pane-trip" data-tab="trip" type="button">
            <span class="ico" aria-hidden="true">👥</span>Trip
          </button>
        </div>
      </div>
      <main class="stage glass">
        <section class="pane map-pane" id="pane-map" role="tabpanel" aria-labelledby="tab-map">
          <div id="map"></div>
          <div class="map-chip" id="map-chip" hidden></div>
          <div class="map-actions" id="map-actions" hidden>
            <button class="gel-btn go" id="btn-start" type="button"><span aria-hidden="true">🚦</span> Start</button>
            <button class="gel-btn" id="btn-route" type="button"><span aria-hidden="true">🧭</span> Whole route</button>
          </div>
        </section>
        <section class="pane scroll" id="pane-schedule" role="tabpanel" aria-labelledby="tab-schedule">
          <div class="trippy-note loading">
            <img src="/web/trippy.png" alt="" width="480" height="384">
            <p>Trippy is fetching your trip…</p>
          </div>
        </section>
        <section class="pane scroll" id="pane-impact" role="tabpanel" aria-labelledby="tab-impact"></section>
        <section class="pane scroll" id="pane-trip" role="tabpanel" aria-labelledby="tab-trip"></section>
      </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="/web/dashboard.js"></script>
  </body>
</html>
